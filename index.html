<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo WoodTools S.R.L.</title>
    <style>
        :root {
            --gris-claro: #f4f4f4;
            --rojo-marca: #cc0000;
            --texto: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--gris-claro);
            color: var(--texto);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .pantalla {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .oculto {
            display: none !important;
        }

        #inicio {
            margin-top: 10vh;
        }

        .logo-inicio {
            max-width: 250px;
            margin-bottom: 30px;
        }

        .btn-rojo {
            background-color: var(--rojo-marca);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-rojo:hover {
            background-color: #a30000;
            transform: scale(1.05);
        }
        
        .btn-rojo:disabled {
            background-color: #999;
            cursor: not-allowed;
            transform: none;
        }

        #ruleta-container {
            margin-top: 20vh;
        }

        .titulo-sorteo {
            color: var(--rojo-marca);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .caja-ruleta {
            background: white;
            border: 3px solid var(--rojo-marca);
            border-radius: 12px;
            width: 90%;
            padding: 30px 10px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--texto);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #ganadores {
            width: 100%;
            max-width: 600px;
        }

        .titulo-final {
            color: var(--rojo-marca);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .tarjeta-ganador {
            background: white;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: row;
            align-items: center;
            text-align: left;
            gap: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
            border-left: 5px solid var(--rojo-marca);
        }

        .tarjeta-ganador.mostrar {
            opacity: 1;
            transform: translateY(0);
        }

        .imagen-premio {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 8px;
            background-color: #000;
        }

        .info-premio {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .puesto-badge {
            background-color: var(--rojo-marca);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            width: fit-content;
            margin-bottom: 5px;
        }

        .nombre-ganador {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--texto);
            margin: 0;
            word-break: break-all;
        }

        @media (min-width: 768px) {
            #inicio {
                flex-direction: row;
                justify-content: center;
                gap: 50px;
                margin-top: 20vh;
                max-width: 800px;
            }
            .logo-inicio {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div id="inicio" class="pantalla">
        <img src="imagenes/logo.png" alt="WoodTools SRL" class="logo-inicio">
        <div>
            <h1 style="color: var(--rojo-marca);">Sorteo Oficial</h1>
            <p id="contador-participantes">Leyendo archivo de base de datos...</p>
            
            <button class="btn-rojo" id="btn-comenzar" onclick="iniciarSorteo()" disabled>Comenzar Sorteo</button>
            
            <input type="file" id="input-csv" accept=".csv" style="display: none;" onchange="leerArchivoManual(event)">
            <br>
            <button class="btn-rojo" id="btn-cargar-manual" onclick="document.getElementById('input-csv').click()" style="display: none; background-color: #555; margin-top: 15px; font-size: 1rem; padding: 10px 20px;">Subir CSV Manualmente</button>
        </div>
    </div>

    <div id="ruleta-container" class="pantalla oculto">
        <h2 class="titulo-sorteo" id="titulo-ruleta">Sorteando 3er Puesto...</h2>
        <div class="caja-ruleta" id="texto-ruleta">@participante</div>
    </div>

    <div id="ganadores" class="pantalla oculto">
        <h2 class="titulo-final">¡Resultados Oficiales!</h2>
        <div id="lista-ganadores" style="width: 100%;"></div>
        <button class="btn-rojo" style="margin-top: 15px;" onclick="location.reload()">Nuevo Sorteo</button>
    </div>

    <script>
        let participantesUnicos = [];

        // 1. Intenta cargar automáticamente al iniciar
        async function cargarParticipantes() {
            try {
                // Primero intenta buscar con el nombre que te sugerí
                let respuesta = await fetch('participantes.csv');
                
                // Si no lo encuentra, intenta buscar con el nombre original larguísimo de Excel
                if (!respuesta.ok) {
                    respuesta = await fetch('Base de datos sorteo.xlsx - Hoja1.csv');
                }

                if (!respuesta.ok) throw new Error("Archivo no encontrado");

                const textoCsv = await respuesta.text();
                procesarTextoCSV(textoCsv);

            } catch (error) {
                console.error("No se pudo cargar automático:", error);
                mostrarFalloCarga();
            }
        }

        // 2. Lógica para separar y limpiar los datos del CSV
        function procesarTextoCSV(textoCsv) {
            const lineas = textoCsv.split(/\r?\n/);
            let todosLosUsuarios = [];

            // Salteamos la primera fila (títulos)
            for (let i = 1; i < lineas.length; i++) {
                const linea = lineas[i].trim();
                if (linea !== '') {
                    // Detectar si Excel separó por coma o punto y coma
                    const separador = linea.includes(';') ? ';' : ',';
                    const columnas = linea.split(separador);
                    
                    // Asegurarnos de que existe la columna B (índice 1)
                    if (columnas.length >= 2) {
                        // Limpiamos espacios y posibles comillas que agrega Excel
                        let usuario = columnas[1].trim().replace(/['"]/g, '');
                        if (usuario && usuario.toLowerCase() !== 'usuario') {
                            todosLosUsuarios.push(usuario);
                        }
                    }
                }
            }

            // Eliminamos duplicados
            participantesUnicos = [...new Set(todosLosUsuarios)];
            
            if(participantesUnicos.length >= 3) {
                document.getElementById('contador-participantes').innerText = `${participantesUnicos.length} participantes únicos validados`;
                document.getElementById('btn-comenzar').disabled = false;
                document.getElementById('btn-cargar-manual').style.display = 'none'; // Ocultamos botón de emergencia
            } else {
                mostrarFalloCarga();
            }
        }

        // 3. Qué hacer si algo falla (mostrar el botón de emergencia)
        function mostrarFalloCarga() {
            document.getElementById('contador-participantes').innerText = "No se pudo leer la base automática. Subí el archivo .csv:";
            document.getElementById('btn-cargar-manual').style.display = 'inline-block';
        }

        // 4. Lógica para leer el archivo si se sube manualmente con el botón
        function leerArchivoManual(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const contenido = e.target.result;
                procesarTextoCSV(contenido);
            };
            lector.readAsText(archivo);
        }

        window.onload = cargarParticipantes;

        const ordenSorteo = [
            { puesto: "3er Puesto", img: "imagenes/premio 3.png" },
            { puesto: "2do Puesto", img: "imagenes/premio 2.png" },
            { puesto: "1er Puesto", img: "imagenes/premio 1.png" }
        ];

        let ganadoresElegidos = [];
        let pasoActual = 0;

        function iniciarSorteo() {
            document.getElementById('inicio').classList.add('oculto');
            document.getElementById('ruleta-container').classList.remove('oculto');
            ejecutarRuleta();
        }

        function ejecutarRuleta() {
            const configuracionActual = ordenSorteo[pasoActual];
            document.getElementById('titulo-ruleta').innerText = `Sorteando ${configuracionActual.puesto}...`;
            
            const elementoRuleta = document.getElementById('texto-ruleta');
            let tiempo = 0;
            const duracionTotal = 3000;
            const velocidad = 50;

            const intervalo = setInterval(() => {
                const nombreAlAzar = participantesUnicos[Math.floor(Math.random() * participantesUnicos.length)];
                elementoRuleta.innerText = "@" + nombreAlAzar;
                tiempo += velocidad;

                if (tiempo >= duracionTotal) {
                    clearInterval(intervalo);
                    seleccionarGanadorDefinitivo();
                }
            }, velocidad);
        }

        function seleccionarGanadorDefinitivo() {
            let indiceGanador;
            do {
                indiceGanador = Math.floor(Math.random() * participantesUnicos.length);
            } while (ganadoresElegidos.includes(participantesUnicos[indiceGanador]));

            const ganador = participantesUnicos[indiceGanador];
            ganadoresElegidos.push(ganador);
            
            document.getElementById('texto-ruleta').innerText = "¡@" + ganador + "!";
            
            setTimeout(() => {
                pasoActual++;
                if (pasoActual < 3) {
                    ejecutarRuleta();
                } else {
                    mostrarPantallaFinal();
                }
            }, 2000);
        }

        function mostrarPantallaFinal() {
            document.getElementById('ruleta-container').classList.add('oculto');
            document.getElementById('ganadores').classList.remove('oculto');
            
            const contenedorLista = document.getElementById('lista-ganadores');
            
            for (let i = 2; i >= 0; i--) {
                const ganador = ganadoresElegidos[i];
                const config = ordenSorteo[i];
                const html = `
                    <div class="tarjeta-ganador" id="tarjeta-${i}">
                        <img src="${config.img}" alt="Premio ${config.puesto}" class="imagen-premio">
                        <div class="info-premio">
                            <div class="puesto-badge">${config.puesto}</div>
                            <div class="nombre-ganador">@${ganador}</div>
                        </div>
                    </div>
                `;
                contenedorLista.innerHTML += html;
            }

            setTimeout(() => document.getElementById('tarjeta-2').classList.add('mostrar'), 100);
            setTimeout(() => document.getElementById('tarjeta-1').classList.add('mostrar'), 600);
            setTimeout(() => document.getElementById('tarjeta-0').classList.add('mostrar'), 1100);
        }
    </script>
</body>
</html>
